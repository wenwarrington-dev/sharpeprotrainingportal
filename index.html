<title>Sharpe Pro Portal</title>
<meta name="description" content="Sharpe Pro Development's training and certification portal for peer recovery specialists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-900:#2C1868;
    --brand-700:#402291;
    --brand-600:#4E2CA6;
    --brand-500:#6343AD;
    --brand-100:#EEE8FA;
    --brand-50:#F6F2FC;
    --gray-900:#201A2E;
    --gray-700:#4B4655;
    --gray-500:#706B7A;
    --gray-300:#D8D3E0;
    --gray-150:#EAE6F0;
    --gray-100:#F2EFF7;

    --ink:var(--gray-900);
    --ink-soft:var(--gray-700);
    --ink-faint:var(--gray-500);
    --paper:#FDFCFE;
    --surface:#FFFFFF;
    --surface-sunken:var(--gray-100);
    --border:var(--gray-150);
    --border-strong:var(--gray-300);
    --accent:var(--brand-700);
    --accent-strong:var(--brand-900);
    --accent-soft:var(--brand-100);
    --accent-soft-2:var(--brand-50);
    --focus-ring:#8B72D6;

    --success:#2F8F5B;
    --success-soft:#E3F3EA;
    --warning:#B8791E;
    --warning-soft:#FBF1DF;
    --critical:#C1402F;
    --critical-soft:#FAE7E4;
    --info:var(--brand-600);
    --info-soft:var(--brand-50);

    --shadow-sm:0 1px 2px rgba(44,24,104,0.06), 0 1px 1px rgba(44,24,104,0.04);
    --shadow-md:0 8px 24px rgba(44,24,104,0.10), 0 2px 6px rgba(44,24,104,0.06);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECE8F5;
      --ink-soft:#C6C0D6;
      --ink-faint:#9A93AE;
      --paper:#150F22;
      --surface:#1E1730;
      --surface-sunken:#170F27;
      --border:#332A4C;
      --border-strong:#463A63;
      --accent:#A98BF2;
      --accent-strong:#C7B2FA;
      --accent-soft:#2E2350;
      --accent-soft-2:#241C3D;
      --focus-ring:#A98BF2;
      --success:#5FC98B;
      --success-soft:#1C3327;
      --warning:#E3A945;
      --warning-soft:#3A2C14;
      --critical:#E88477;
      --critical-soft:#3B211E;
      --info:#A98BF2;
      --info-soft:#241C3D;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECE8F5;
    --ink-soft:#C6C0D6;
    --ink-faint:#9A93AE;
    --paper:#150F22;
    --surface:#1E1730;
    --surface-sunken:#170F27;
    --border:#332A4C;
    --border-strong:#463A63;
    --accent:#A98BF2;
    --accent-strong:#C7B2FA;
    --accent-soft:#2E2350;
    --accent-soft-2:#241C3D;
    --focus-ring:#A98BF2;
    --success:#5FC98B;
    --success-soft:#1C3327;
    --warning:#E3A945;
    --warning-soft:#3A2C14;
    --critical:#E88477;
    --critical-soft:#3B211E;
    --info:#A98BF2;
    --info-soft:#241C3D;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;color:var(--ink);margin:0 0 4px;text-wrap:balance;}
  p{margin:0 0 10px;color:var(--ink-soft);}
  a{color:var(--accent);}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-body);}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- buttons & inputs ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:var(--font-body);font-weight:600;font-size:14px;
    padding:10px 16px;border-radius:10px;border:1px solid transparent;
    cursor:pointer;transition:transform .05s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border-strong);}
  .btn-secondary:hover{border-color:var(--accent);}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--surface-sunken);color:var(--ink);}
  .btn-danger{background:transparent;color:var(--critical);border-color:var(--critical);}
  .btn-danger:hover{background:var(--critical-soft);}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-block{width:100%;}

  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:14px;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:5px;}
  .file-drop{
    border:1.5px dashed var(--border-strong);border-radius:10px;padding:16px;text-align:center;
    background:var(--surface-sunken);cursor:pointer;font-size:13.5px;color:var(--ink-soft);
  }
  .file-drop:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- layout ---------- */
  #app{min-height:100vh;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1200px 600px at 12% -10%, var(--accent-soft) 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, var(--accent-soft-2) 0%, transparent 55%),
    var(--paper);}
  .auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow-md);}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand-row img{height:48px;width:auto;display:block;}
  .tab-row{display:flex;gap:4px;background:var(--surface-sunken);padding:4px;border-radius:10px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:8px 10px;border-radius:7px;border:none;background:transparent;cursor:pointer;
    font-weight:600;font-size:13.5px;color:var(--ink-faint);}
  .tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm);}

  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex:none;background:var(--surface);border-right:1px solid var(--border);
    padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar .brand-row{margin-bottom:4px;padding:0 6px;}
  .sidebar .brand-row .word{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.2px;}
  .sidebar .role-pill{margin:0 6px;}
  nav.navlist{display:flex;flex-direction:column;gap:2px;}
  .navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-soft);
    text-decoration:none;font-weight:600;font-size:13.8px;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;}
  .navlink:hover{background:var(--surface-sunken);color:var(--ink);}
  .navlink.active{background:var(--accent-soft);color:var(--accent-strong);}
  .navlink .ic{width:18px;text-align:center;font-size:15px;}
  .nav-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
    font-weight:700;padding:10px 10px 2px;}
  .sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
  .who{padding:6px 10px 10px;}
  .who .name{font-weight:700;font-size:13.5px;}
  .who .email{font-size:12px;color:var(--ink-faint);}

  .main{flex:1;min-width:0;}
  .topbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--border);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .content{padding:26px 28px 60px;max-width:1080px;}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .page-head h1{font-size:26px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}

  .grid{display:grid;gap:16px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:860px){.grid-3,.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;box-shadow:var(--shadow-sm);}
  .card h3{font-size:15.5px;}
  .stat-card .stat-label{font-size:12.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .stat-value{font-family:var(--font-mono);font-size:30px;font-weight:500;color:var(--ink);margin-top:6px;}
  .stat-card .stat-sub{font-size:12.5px;color:var(--ink-faint);margin-top:4px;}

  .section{margin-bottom:30px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-title h2{font-size:18px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);
    padding:0 12px 8px;font-weight:700;}
  td{padding:12px;font-size:14px;border-top:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--surface-sunken);}
  .table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);}
  .table-wrap table{min-width:560px;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .pill-neutral{background:var(--surface-sunken);color:var(--ink-faint);}
  .pill-success{background:var(--success-soft);color:var(--success);}
  .pill-warning{background:var(--warning-soft);color:var(--warning);}
  .pill-critical{background:var(--critical-soft);color:var(--critical);}
  .pill-info{background:var(--info-soft);color:var(--info);}
  .pill-brand{background:var(--accent-soft);color:var(--accent-strong);}

  .progress{height:8px;border-radius:99px;background:var(--surface-sunken);overflow:hidden;}
  .progress > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}
  .progress.success > span{background:var(--success);}

  .checklist{display:flex;flex-direction:column;gap:10px;}
  .check-row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--border);
    border-radius:var(--radius-md);background:var(--surface);}
  .check-row.done{background:var(--success-soft);border-color:transparent;}
  .check-badge{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--border-strong);color:transparent;font-size:14px;margin-top:1px;}
  .check-row.done .check-badge{background:var(--success);border-color:var(--success);color:#fff;}
  .check-body{flex:1;min-width:0;}
  .check-title{font-weight:700;font-size:14.5px;}
  .check-meta{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
  .check-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,12,38,.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;width:100%;max-width:460px;
    box-shadow:var(--shadow-md);max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .icon-btn{background:none;border:none;font-size:18px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:4px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:340px;}
  .toast{padding:12px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-md);
    animation:toastin .18s ease;}
  .toast.ok{background:var(--success);color:#fff;}
  .toast.err{background:var(--critical);color:#fff;}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .empty{padding:34px 20px;text-align:center;color:var(--ink-faint);}
  .divider{height:1px;background:var(--border);margin:18px 0;}
  .muted{color:var(--ink-faint);font-size:13px;}
  .mobile-topbar{display:none;}
  .menu-toggle{display:none;}

  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(20,12,38,.45);z-index:39;}
  .sidebar-backdrop.show{display:block;}

  @media (max-width: 780px){
    .shell{display:block;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s ease;
      z-index:40;box-shadow:var(--shadow-md);}
    .sidebar.open{transform:none;}
    .content{padding:18px 16px 60px;}
    .topbar{padding:14px 16px;position:relative;z-index:41;}
    .menu-toggle{display:inline-flex;position:relative;z-index:41;}
    .grid-3{grid-template-columns:1fr;}
  }
</style>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
}
function daysUntil(d){
  const dt = new Date(d + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((dt-now)/86400000);
}
function toast(msg, kind){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + (kind === "err" ? "err" : "ok");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function costLabel(cost){
  if (cost === 0) return "Free";
  if (cost === null || cost === undefined || cost === "") return "Varies";
  return "$" + cost;
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function loadTraineeData(userId){
  const [classesRes, enrollRes, milestoneRes, recertRes, ceRes] = await Promise.all([
    sb.from("classes").select("*").order("sort_order"),
    sb.from("enrollments").select("*").eq("user_id", userId),
    sb.from("certification_milestones").select("*").eq("user_id", userId),
    sb.from("recert_cycles").select("*").eq("user_id", userId).maybeSingle(),
    sb.from("ce_logs").select("*").eq("user_id", userId).order("date_completed", { ascending:false }),
  ]);
  state.data.classes = classesRes.data || [];
  state.data.enrollments = enrollRes.data || [];
  state.data.milestones = milestoneRes.data || [];
  state.data.recert = recertRes.data || null;
  state.data.ceLogs = ceRes.data || [];
}

async function loadAdminData(){
  const [profilesRes, classesRes, enrollRes, milestoneRes, recertRes, ceRes, assignRes] = await Promise.all([
    sb.from("profiles").select("*").order("created_at"),
    sb.from("classes").select("*").order("sort_order"),
    sb.from("enrollments").select("*"),
    sb.from("certification_milestones").select("*"),
    sb.from("recert_cycles").select("*"),
    sb.from("ce_logs").select("*"),
    sb.from("supervisor_assignments").select("*"),
  ]);
  state.adminData.trainees = (profilesRes.data || []).filter(p => p.role === "trainee");
  state.adminData.allStaff = (profilesRes.data || []).filter(p => p.role !== "trainee");
  state.data.classes = classesRes.data || [];
  state.adminData.allEnrollments = enrollRes.data || [];
  state.adminData.allMilestones = milestoneRes.data || [];
  state.adminData.allRecert = recertRes.data || [];
  state.adminData.allCeLogs = ceRes.data || [];
  state.adminData.allAssignments = assignRes.data || [];
}

function isStaffRole(role){
  return role === "admin" || role === "supervisor" || role === "ccar_facilitator";
}
function roleScope(){
  const r = state.profile.role;
  if (r === "ccar_facilitator") return "ccar";
  if (r === "supervisor") return "supervisor";
  return "admin";
}
function roleLabel(role){
  if (role === "admin") return "Admin";
  if (role === "supervisor") return "Supervisor";
  if (role === "ccar_facilitator") return "CCAR Facilitator";
  return "Trainee";
}
function defaultViewForRole(role){
  if (role === "admin") return "admin_dashboard";
  if (isStaffRole(role)) return "admin_trainees";
  return "dashboard";
}

async function refreshAll(){
  if (!state.session) return;
  if (isStaffRole(state.profile.role)) await loadAdminData();
  else await loadTraineeData(state.profile.id);
}

async function uploadCertificateFile(file, forUserId){
  const path = `${forUserId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g,"_")}`;
  const { error } = await sb.storage.from("certificates").upload(path, file, { upsert:false });
  if (error) throw error;
  return path;
}
async function signedUrlFor(path){
  const { data, error } = await sb.storage.from("certificates").createSignedUrl(path, 300);
  if (error) throw error;
  return data.signedUrl;
}

const root = document.getElementById("app");

function render(){
  if (!sb){
    root.innerHTML = renderConfigMissing();
    return;
  }
  if (state.loading){
    root.innerHTML = `<div class="center-screen"><div class="muted">Loading Sharpe Pro Portal…</div></div>`;
    return;
  }
  if (!state.session){
    root.innerHTML = renderAuth();
    wireAuth();
    return;
  }
  root.innerHTML = renderShell();
  wireShell();
  wireView();
}

// 6. TRAINEE: helpers for progress
// ---------------------------------------------------------------------
function enrollmentFor(classId){
  return state.data.enrollments.find(e=>e.class_id===classId);
}
function milestoneFor(pathway, key){
  return state.data.milestones.find(m=>m.pathway===pathway && m.milestone_key===key);
}
function ohioProgress(){
  const learn = state.data.classes.find(c=>c.pathway==="ohio" && c.category==="prerequisite");
  const prs = state.data.classes.find(c=>c.pathway==="ohio" && c.category==="live_training");
  const ccarAlt = state.data.classes.filter(c=>c.pathway==="ccar" && c.category==="core");
  const steps = [];
  if (learn) steps.push({ type:"class", cls: learn, done: enrollmentFor(learn.id)?.status === "completed" });
  steps.push({ type:"milestone", def: OHIO_MILESTONES[0], done: !!milestoneFor("ohio","background_check")?.completed });
  const prsDone = (prs && enrollmentFor(prs.id)?.status === "completed") ||
    ccarAlt.every(c => enrollmentFor(c.id)?.status === "completed");
  steps.push({ type:"class", cls: prs, done: prsDone, note: prs ? null : "40-hour training" });
  OHIO_MILESTONES.slice(1).forEach(def=>{
    steps.push({ type:"milestone", def, done: !!milestoneFor("ohio", def.key)?.completed });
  });
  const done = steps.filter(s=>s.done).length;
  return { steps, done, total: steps.length, pct: Math.round(100*done/steps.length) };
}
function ccarProgress(){
  const ccarClasses = state.data.classes.filter(c=>c.pathway==="ccar");
  const hoursDone = ccarClasses.reduce((sum,c)=> sum + (enrollmentFor(c.id)?.status==="completed" ? Number(c.hours):0), 0);
  const pct = Math.min(100, Math.round(100*hoursDone/CCAR_TOTAL_HOURS));
  const rcpDone = !!milestoneFor("ccar","rcp_earned")?.completed;
  return { hoursDone, total: CCAR_TOTAL_HOURS, pct, rcpDone, classes: ccarClasses };
}
function supervisorProgress(){
  const done = OHIO_SUPERVISOR_MILESTONES.filter(def=>!!milestoneFor("ohio_supervisor",def.key)?.completed).length;
  const total = OHIO_SUPERVISOR_MILESTONES.length;
  return { done, total, pct: Math.round(100*done/total) };
}
function ceProgress(){
  const totalsByTopic = {};
  CE_TOPICS.forEach(t=>totalsByTopic[t.key]=0);
  let totalHours = 0;
  state.data.ceLogs.forEach(l=>{
    totalsByTopic[l.topic_area] = (totalsByTopic[l.topic_area]||0) + Number(l.hours);
    totalHours += Number(l.hours);
  });
  return { totalsByTopic, totalHours };
}

function wireCommonStepActions(){
  document.querySelectorAll("[data-upload-class]").forEach(el=>{
    el.onchange = async (e)=>{
      const file = e.target.files[0]; if (!file) return;
      const classId = el.dataset.uploadClass;
      try{
        const path = await uploadCertificateFile(file, state.profile.id);
        const existing = enrollmentFor(classId);
        const payload = { user_id: state.profile.id, class_id: classId, status:"completed",
          completed_date: new Date().toISOString().slice(0,10), certificate_path: path };
        if (existing){
          await sb.from("enrollments").update(payload).eq("id", existing.id);
        } else {
          await sb.from("enrollments").insert(payload);
        }
        await loadTraineeData(state.profile.id);
        toast("Certificate uploaded and class marked complete.");
        renderContent();
      }catch(err){ toast(err.message || "Upload failed", "err"); }
    };
  });
  document.querySelectorAll("[data-view-cert]").forEach(el=>{
    el.onclick = async (e)=>{
      e.preventDefault();
      const path = el.dataset.viewCert;
      if (!path){ toast("No certificate uploaded for this class yet.","err"); return; }
      try{ const url = await signedUrlFor(path); window.open(url, "_blank"); }
      catch(err){ toast(err.message||"Couldn't open file","err"); }
    };
  });
  document.querySelectorAll("[data-toggle-milestone]").forEach(el=>{
    el.onclick = async ()=>{
      const [pathway, key] = el.dataset.toggleMilestone.split(":");
      const existing = milestoneFor(pathway, key);
      const completed = !(existing?.completed);
      const payload = { user_id: state.profile.id, pathway, milestone_key:key, completed,
        completed_date: completed ? new Date().toISOString().slice(0,10) : null };
      await sb.from("certification_milestones").upsert(payload, { onConflict:"user_id,pathway,milestone_key" });
      await loadTraineeData(state.profile.id);
      toast(completed?"Marked complete.":"Marked not done.");
      renderContent();
    };
  });
  document.querySelectorAll("[data-nav2]").forEach(el=>{
    el.onclick = ()=>{ state.view = el.dataset.nav2; renderContent(); };
  });
}

function openModal(cfg){
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.id = "modalRoot";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3>${escapeHtml(cfg.title)}</h3><button class="icon-btn" id="modalClose">✕</button></div>
    <form id="modalForm">${cfg.body}<div style="display:flex;gap:10px;margin-top:6px;">
      <button type="submit" class="btn btn-primary btn-block">Save</button>
    </div></form>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("modalClose").onclick = closeModal;
  wrap.onclick = (e)=>{ if (e.target === wrap) closeModal(); };
  document.getElementById("modalForm").onsubmit = (e)=>{ e.preventDefault(); cfg.onSubmit(); };
  if (cfg.afterMount) cfg.afterMount();
}
function closeModal(){ document.getElementById("modalRoot")?.remove(); }

      ${supervisors.length ? supervisors.map(sup=>`
        <div class="card section">
          <strong>${escapeHtml(sup.full_name||sup.email||"")}</strong>
          <div class="grid grid-2" style="margin-top:10px;">
            ${state.adminData.trainees.map(t=>{
              const assigned = assignments.some(a=>a.supervisor_id===sup.id && a.trainee_id===t.id);
              return `<label style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13.5px;">
                <input type="checkbox" data-assign-sup="${sup.id}" data-assign-trainee="${t.id}" ${assigned?'checked':''}>
                ${escapeHtml(t.full_name||t.email||"")}
              </label>`;
            }).join("") || `<span class="muted">No trainees yet.</span>`}
          </div>
        </div>
      `).join("") : `<div class="card empty">Make someone a Supervisor above to assign peer coaches to them.</div>`}
    </div>
  `;
}
function wireAdminStaff(){
  const promoteBtn = document.getElementById("promoteBtn");
  if (promoteBtn) promoteBtn.onclick = async ()=>{
    const uid = document.getElementById("promoteUserSelect").value;
    const role = document.getElementById("promoteRoleSelect").value;
    if (!uid){ toast("Pick a trainee first","err"); return; }
    const { error } = await sb.from("profiles").update({ role }).eq("id", uid);
    if (error){ toast(error.message,"err"); return; }
    await loadAdminData();
    toast("Role updated.");
    renderContent();
  };
  document.querySelectorAll("[data-demote]").forEach(b=>{
    b.onclick = async ()=>{
      if (!confirm("Set this person back to a regular trainee account?")) return;
      await sb.from("profiles").update({ role: "trainee" }).eq("id", b.dataset.demote);
      await loadAdminData();
      renderContent();
    };
  });
  document.querySelectorAll("[data-assign-sup]").forEach(cb=>{
    cb.onchange = async ()=>{
      const supervisor_id = cb.dataset.assignSup;
      const trainee_id = cb.dataset.assignTrainee;
      if (cb.checked){
        const { error } = await sb.from("supervisor_assignments").insert({ supervisor_id, trainee_id });
        if (error) toast(error.message,"err");
      } else {
        await sb.from("supervisor_assignments").delete().eq("supervisor_id", supervisor_id).eq("trainee_id", trainee_id);
      }
      await loadAdminData();
    };
  });
}

// ---------------------------------------------------------------------
// 14. BOOT
// ---------------------------------------------------------------------
async function boot(){
  if (!sb){ state.loading=false; render(); return; }
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if (session){
    const { data: profile } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    state.profile = profile;
    await refreshAll();
  }
  state.loading = false;
  render();

  sb.auth.onAuthStateChange(async (event, session)=>{
    state.session = session;
    if (session){
      state.loading = true; render();
      const { data: profile } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      state.profile = profile;
      await refreshAll();
      state.loading = false;
      state.view = defaultViewForRole(state.profile?.role);
    } else {
      state.profile = null;
    }
    render();
  });
}
boot();
</script>
